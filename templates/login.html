{% extends "base.html" %}
{% block title %}{{ 'Register' if mode == 'register' else 'Login' }} — MotoLog{% endblock %}

{% block content %}
<div style="max-width:420px; margin:60px auto;">

  <div style="text-align:center; margin-bottom:32px;">
    <h1 style="font-family:var(--font-display); font-size:2.6rem; font-weight:900; letter-spacing:0.04em;">
      Moto<span style="color:var(--orange);">Log</span>
    </h1>
    <p style="color:var(--text-muted); margin-top:6px; font-size:0.9rem;">
      Motorcycle Tourer's Companion
    </p>
  </div>

  <div class="card">
    <div style="display:flex; gap:0; margin-bottom:24px; background:var(--bg-elevated); border-radius:var(--radius); padding:4px;">
      <a href="{{ url_for('login') }}"
         style="flex:1; text-align:center; padding:8px; border-radius:var(--radius); font-weight:600; font-size:0.88rem;
                {% if mode == 'login' %}background:var(--bg-card); color:var(--orange);{% else %}color:var(--text-muted);{% endif %}">
        Login
      </a>
      <a href="{{ url_for('register') }}"
         style="flex:1; text-align:center; padding:8px; border-radius:var(--radius); font-weight:600; font-size:0.88rem;
                {% if mode == 'register' %}background:var(--bg-card); color:var(--orange);{% else %}color:var(--text-muted);{% endif %}">
        Register
      </a>
    </div>

    <form method="POST">
      {% if mode == 'register' %}
      <div class="form-group" style="margin-bottom:14px;">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required placeholder="rider_name">
      </div>
      {% endif %}

      <div class="form-group" style="margin-bottom:14px;">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">
      </div>

      <div class="form-group" style="margin-bottom:14px;">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">
      </div>

      {% if mode == 'register' %}
      <div class="form-group" style="margin-bottom:20px;">
        <label for="bike_model">Bike Model <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>
        <input type="text" id="bike_model" name="bike_model" placeholder="e.g. Royal Enfield Himalayan 450">
      </div>
      {% endif %}

      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">
        {{ 'Create Account' if mode == 'register' else 'Login' }}
      </button>
    </form>
  </div>

</div>
{% endblock %}
