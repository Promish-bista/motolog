{% extends "base.html" %}
{% block title %}Profile — MotoLog{% endblock %}

{% block content %}
<div class="page-header">
  <h1>My <span class="accent">Profile</span></h1>
  <p>Update your account details</p>
</div>

<div class="card" style="max-width:500px;">
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-grid">

      <div class="form-group full">
        <label for="username">Username</label>
        <input type="text" id="username" name="username"
               value="{{ current_user.username }}" required>
      </div>

      <div class="form-group full">
        <label for="email">Email <span style="color:var(--text-muted);font-weight:400;">(cannot be changed)</span></label>
        <input type="email" value="{{ current_user.email }}" disabled
               style="opacity:0.5; cursor:not-allowed;">
      </div>

      <div class="form-group full">
        <label for="bike_model">Bike Model</label>
        <input type="text" id="bike_model" name="bike_model"
               value="{{ current_user.bike_model or '' }}"
               placeholder="e.g. Royal Enfield Himalayan 450">
      </div>

      <div class="form-group full">
        <label>Role</label>
        <div style="padding:10px 14px; background:var(--bg-elevated); border-radius:var(--radius); border:1px solid var(--border);">
          <span class="badge {% if current_user.role == 'admin' %}badge-active{% else %}badge-planned{% endif %}">
            {{ current_user.role }}
          </span>
        </div>
      </div>

      <div class="form-group full">
        <label>Last Login</label>
        <div style="padding:10px 14px; background:var(--bg-elevated); border-radius:var(--radius); border:1px solid var(--border); color:var(--text-secondary);">
          {{ current_user.last_login.strftime('%d %B %Y, %H:%M') if current_user.last_login else 'First session' }}
        </div>
      </div>

      <div class="form-group full" style="margin-top:8px; padding-top:16px; border-top:1px solid var(--border);">
        <label>Change Password <span style="color:var(--text-muted);font-weight:400;">(leave blank to keep current)</span></label>
      </div>

      <div class="form-group">
        <label for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password" placeholder="Enter new password">
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password">
      </div>

    </div>

    <div class="modal-actions" style="margin-top:20px;">
      <a href="{{ url_for('dashboard') }}" class="btn btn-ghost" style="padding:6px 16px; font-size:0.82rem;">Cancel</a>
      <button type="submit" class="btn btn-primary" style="padding:6px 16px; font-size:0.82rem;">Save Changes</button>
    </div>
  </form>
</div>
{% endblock %}
